<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防犯カメラ</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    h2 { margin-top: 0; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    video, canvas { width: 100%; max-width: 480px; background: #000; border-radius: 6px; display: block; margin-bottom: 10px; }
    button, input { padding: 10px 15px; font-size: 14px; margin: 5px 2px; border: none; border-radius: 4px; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    input[type="text"] { background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px; }
    .status { font-weight: bold; color: #00ffcc; margin-bottom: 10px; padding: 10px; background: #222; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>

  <h2>📱 防犯カメラシステム</h2>
  <div class="status" id="statusText">モードを選択してください</div>

  <div class="card">
    <label>🔑 ルームID (同じ文字列を入力):</label><br>
    <input type="text" id="roomId" value="my-room-777" style="width: 80%; padding: 8px; margin-top: 5px;"><br><br>
    
    <button id="btnCamera" onclick="startCamera()">📷 1. カメラ側（映像を送信する）</button>
    <button id="btnMonitor" onclick="startMonitor()">📺 2. モニター側（映像を見るだけ）</button>
  </div>

  <div class="card">
    <h3>🎥 画面エリア</h3>
    
    <div id="cameraBox" style="display:none;">
      <p>📹 カメラ撮影中（送信中）:</p>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div id="monitorBox" style="display:none;">
      <p>📺 受信した映像（監視画面）:</p>
      <video id="remoteVideo" autoplay playsinline controls style="width:100%; min-height:240px; background:#000;"></video>
    </div>

    <canvas id="motionCanvas" style="display:none;"></canvas>
  </div>

  <div class="card">
    <h3>🚨 動体検知 ＆ Discord画像通知設定</h3>
    <label>Discord Webhook URL:</label><br>
    <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." style="width:90%;"><br><br>
    
    <label>感度レベル (小＝高感度): <span id="threshVal">5</span></label><br>
    <input type="range" id="threshold" min="1" max="100" value="5" oninput="document.getElementById('threshVal').innerText=this.value"><br>
    <small style="color: #aaa;">※ 連投防止のため、一度送信すると次まで【15秒間】待機します。</small>
  </div>

  <script>
    let localStream, pc, ws;
    let myRole = '';
    let roomId = '';
    let offerTimer = null;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    
    let motionInterval, prevFrame = null;
    let lastAlertTime = 0;
    let isSending = false; // 送信中フラグ（二重送信防止）

    const SIGNALING_SERVER = 'wss://kannsi-8g8j.onrender.com';

    async function startCamera() {
      myRole = 'camera';
      disableButtons();
      document.getElementById('cameraBox').style.display = 'block';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
          audio: true 
        });
        document.getElementById('localVideo').srcObject = localStream;
        
        startMotionDetection();
        connectWebSocket();
      } catch (err) {
        alert("カメラ起動失敗: " + err);
      }
    }

    function startMonitor() {
      myRole = 'monitor';
      disableButtons();
      document.getElementById('monitorBox').style.display = 'block';
      connectWebSocket();
    }

    function connectWebSocket() {
      roomId = document.getElementById('roomId').value.trim();
      if (!roomId) return alert("ルームIDを入力してください");

      updateStatus(`サーバー接続中...`);
      ws = new WebSocket(SIGNALING_SERVER);

      ws.onopen = () => {
        updateStatus("サーバー接続完了。待機中...");
        if (myRole === 'monitor') startOfferLoop();
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.roomId !== roomId || msg.sender === myRole) return;

        if (msg.sdp) {
          if (msg.sdp.type === 'offer' && myRole === 'camera') {
            createPeerConnection();
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendSignal({ sdp: pc.localDescription });
            updateStatus("🟢 モニター側へ映像送信を開始しました！");
          } 
          else if (msg.sdp.type === 'answer' && myRole === 'monitor') {
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          }
        } else if (msg.candidate && pc) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch (e) {}
        }
      };
    }

    function createPeerConnection() {
      if (pc) pc.close();
      pc = new RTCPeerConnection(config);

      pc.onicecandidate = (event) => {
        if (event.candidate) sendSignal({ candidate: event.candidate });
      };

      pc.ontrack = (event) => {
        if (myRole === 'monitor') {
          const remoteVideo = document.getElementById('remoteVideo');
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.play();
          updateStatus("🟢 映像を受信しました！監視中");
          if (offerTimer) clearInterval(offerTimer);
        }
      };
    }

    function startOfferLoop() {
      offerTimer = setInterval(async () => {
        createPeerConnection();
        const offer = await pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
        await pc.setLocalDescription(offer);
        sendSignal({ sdp: pc.localDescription });
        updateStatus("カメラを探しています...");
      }, 3000);
    }

    function sendSignal(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ ...data, roomId: roomId, sender: myRole }));
      }
    }

    function disableButtons() {
      document.getElementById('btnCamera').disabled = true;
      document.getElementById('btnMonitor').disabled = true;
    }

    function updateStatus(txt) {
      document.getElementById('statusText').innerText = txt;
    }

    // --- 動体検知処理 ---
    function startMotionDetection() {
      const video = document.getElementById('localVideo');
      const canvas = document.getElementById('motionCanvas');
      const ctx = canvas.getContext('2d');

      motionInterval = setInterval(() => {
        if (!video.videoWidth || isSending) return; // 送信中なら検知をスキップ

        canvas.width = 320;
        canvas.height = 240;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (prevFrame) {
          let diffCount = 0;
          const threshold = parseInt(document.getElementById('threshold').value);

          for (let i = 0; i < currentFrame.data.length; i += 4) {
            const rDiff = Math.abs(currentFrame.data[i] - prevFrame.data[i]);
            const gDiff = Math.abs(currentFrame.data[i+1] - prevFrame.data[i+1]);
            const bDiff = Math.abs(currentFrame.data[i+2] - prevFrame.data[i+2]);

            if (rDiff + gDiff + bDiff > 30) diffCount++;
          }

          const triggerLimit = (canvas.width * canvas.height) * (threshold / 5000);

          if (diffCount > triggerLimit) {
            triggerAlert(canvas);
          }
        }
        prevFrame = currentFrame;
      }, 500);
    }

    // --- 画像送信処理 (エラー対策強化) ---
    async function triggerAlert(canvas) {
      const now = Date.now();
      // クールダウン: 15秒間は連投しない
      if (now - lastAlertTime < 15000) return;
      
      const webhookUrl = document.getElementById('webhookUrl').value.trim();
      if (!webhookUrl) return;

      isSending = true; // 送信開始
      lastAlertTime = now;
      updateStatus("🚨 動体検知！画像作成中...");

      try {
        // Blob作成をPromise化してタイムアウト・フリーズを防ぐ
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
        if (!blob) throw new Error("画像データの作成に失敗しました");

        updateStatus("🚨 Discordへ送信中...");

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({
          content: "🚨 【防犯カメラ】動体を検知しました！"
        }));
        formData.append('file', blob, 'capture.jpg');

        const response = await fetch(webhookUrl, {
          method: 'POST',
          body: formData
        });

        if (response.ok || response.status === 204) {
          updateStatus("🟢 Discordへ画像送信完了！(15秒待機中)");
        } else if (response.status === 429) {
          // レート制限エラー（送りすぎ）
          updateStatus("⚠️ 送りすぎのためDiscord側で制限中。少し時間を置きます。");
        } else {
          updateStatus(`❌ 送信エラー (HTTP Status: ${response.status})`);
        }
      } catch (err) {
        console.error("送信エラー:", err);
        updateStatus("❌ エラー発生: " + err.message);
      } finally {
        isSending = false; // 送信完了（または失敗）したら復帰
      }
    }
  </script>
</body>
</html>
