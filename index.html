<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防犯カメラ</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    h2 { margin-top: 0; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    video, canvas { width: 100%; max-width: 480px; background: #000; border-radius: 6px; display: block; margin-bottom: 10px; }
    button, input { padding: 10px 15px; font-size: 14px; margin: 5px 2px; border: none; border-radius: 4px; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    input[type="text"] { background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px; }
    .status { font-weight: bold; color: #00ffcc; margin-bottom: 10px; padding: 10px; background: #222; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>📱 防犯カメラシステム</h2>
  <div class="status" id="statusText">モードを選択してください</div>

  <div class="card">
    <label>🔑 ルームID (同じ文字列を入力):</label><br>
    <input type="text" id="roomId" value="my-room-777" style="width: 80%; padding: 8px; margin-top: 5px;"><br><br>
    
    <button id="btnCamera" onclick="startCamera()">📷 1. カメラ側（映像を送信する）</button>
    <button id="btnMonitor" onclick="startMonitor()">📺 2. モニター側（映像を見るだけ）</button>
  </div>

  <div class="card">
    <h3>🎥 画面エリア</h3>
    
    <!-- カメラ側：自分のカメラ映像確認用 -->
    <div id="cameraBox" style="display:none;">
      <p>📹 カメラ撮影中（送信中）:</p>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- モニター側：相手（カメラ）から送られてきた映像 -->
    <div id="monitorBox" style="display:none;">
      <p>📺 受信した映像（監視画面）:</p>
      <video id="remoteVideo" autoplay playsinline controls style="width:100%; min-height:240px; background:#000;"></video>
    </div>

    <!-- キャプチャ・動体検知用 canvas -->
    <canvas id="motionCanvas" style="display:none;"></canvas>
  </div>

  <div class="card">
    <h3>🚨 動体検知 ＆ Discord画像通知設定</h3>
    <label>Discord Webhook URL:</label><br>
    <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." style="width:90%;"><br><br>
    
    <!-- 感度設定：1（超高感度）〜 100（低感度） -->
    <label>感度レベル (小＝高感度): <span id="threshVal">1</span></label><br>
    <input type="range" id="threshold" min="1" max="100" value="1" oninput="document.getElementById('threshVal').innerText=this.value"><br>
    <small style="color: #aaa;">※ 1に設定すると、光の微かな揺れやわずかな動きでも即反応します。</small>
  </div>

  <script>
    let localStream, pc, ws;
    let myRole = '';
    let roomId = '';
    let offerTimer = null;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    
    let motionInterval, prevFrame = null;
    let lastAlertTime = 0;

    const SIGNALING_SERVER = 'wss://kannsi-8g8j.onrender.com';

    // --- 1. カメラ側 ---
    async function startCamera() {
      myRole = 'camera';
      disableButtons();
      document.getElementById('cameraBox').style.display = 'block';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
          audio: true 
        });
        document.getElementById('localVideo').srcObject = localStream;
        
        startMotionDetection();
        connectWebSocket();
      } catch (err) {
        alert("カメラ起動失敗: " + err);
      }
    }

    // --- 2. モニター側 ---
    function startMonitor() {
      myRole = 'monitor';
      disableButtons();
      document.getElementById('monitorBox').style.display = 'block';
      connectWebSocket();
    }

    // --- WebSocket 通信 ---
    function connectWebSocket() {
      roomId = document.getElementById('roomId').value.trim();
      if (!roomId) return alert("ルームIDを入力してください");

      updateStatus(`サーバー接続中...`);
      ws = new WebSocket(SIGNALING_SERVER);

      ws.onopen = () => {
        updateStatus("サーバー接続完了。待機中...");
        if (myRole === 'monitor') startOfferLoop();
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.roomId !== roomId || msg.sender === myRole) return;

        if (msg.sdp) {
          if (msg.sdp.type === 'offer' && myRole === 'camera') {
            createPeerConnection();
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendSignal({ sdp: pc.localDescription });
            updateStatus("🟢 モニター側へ映像送信を開始しました！");
          } 
          else if (msg.sdp.type === 'answer' && myRole === 'monitor') {
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          }
        } else if (msg.candidate && pc) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch (e) {}
        }
      };
    }

    function createPeerConnection() {
      if (pc) pc.close();
      pc = new RTCPeerConnection(config);

      pc.onicecandidate = (event) => {
        if (event.candidate) sendSignal({ candidate: event.candidate });
      };

      pc.ontrack = (event) => {
        if (myRole === 'monitor') {
          const remoteVideo = document.getElementById('remoteVideo');
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.play();
          updateStatus("🟢 映像を受信しました！監視中");
          if (offerTimer) clearInterval(offerTimer);
        }
      };
    }

    function startOfferLoop() {
      offerTimer = setInterval(async () => {
        createPeerConnection();
        const offer = await pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
        await pc.setLocalDescription(offer);
        sendSignal({ sdp: pc.localDescription });
        updateStatus("カメラを探しています...");
      }, 3000);
    }

    function sendSignal(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ ...data, roomId: roomId, sender: myRole }));
      }
    }

    function disableButtons() {
      document.getElementById('btnCamera').disabled = true;
      document.getElementById('btnMonitor').disabled = true;
    }

    function updateStatus(txt) {
      document.getElementById('statusText').innerText = txt;
    }

    // --- 超過敏動体検知 ＆ 画像送信処理 ---
    function startMotionDetection() {
      const video = document.getElementById('localVideo');
      const canvas = document.getElementById('motionCanvas');
      const ctx = canvas.getContext('2d');

      motionInterval = setInterval(() => {
        if (!video.videoWidth) return;

        // 検知用の解像度
        canvas.width = 320;
        canvas.height = 240;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (prevFrame) {
          let diffCount = 0;
          const threshold = parseInt(document.getElementById('threshold').value);

          // ピクセルの変化を判定（RGB合計値の差が 20 以上で「動き」と判定）
          for (let i = 0; i < currentFrame.data.length; i += 4) {
            const rDiff = Math.abs(currentFrame.data[i] - prevFrame.data[i]);
            const gDiff = Math.abs(currentFrame.data[i+1] - prevFrame.data[i+1]);
            const bDiff = Math.abs(currentFrame.data[i+2] - prevFrame.data[i+2]);

            if (rDiff + gDiff + bDiff > 20) diffCount++;
          }

          // 閾値に応じたトリガー計算（スライダー1の時に極めて小さい変化でも反応）
          const triggerLimit = (canvas.width * canvas.height) * (threshold / 10000);

          if (diffCount > triggerLimit) {
            triggerAlert(canvas);
          }
        }
        prevFrame = currentFrame;
      }, 300); // 300ms間隔でチェック（高速化）
    }

    // 画像付き通知を送信
    function triggerAlert(canvas) {
      const now = Date.now();
      // スパム防止（一度検知したら10秒間は再送信を制限）
      if (now - lastAlertTime < 10000) return;
      lastAlertTime = now;

      updateStatus("🚨 動体検知！画像付き通知を Discord に送信中...");

      const webhookUrl = document.getElementById('webhookUrl').value.trim();
      if (!webhookUrl) return;

      // canvasの現在の画像をBlob（画像ファイルデータ）に変換して送信
      canvas.toBlob((blob) => {
        if (!blob) return;

        const formData = new FormData();
        // Discord用のペイロード作成
        formData.append('payload_json', JSON.stringify({
          content: "🚨 【防犯カメラ】動体を検知しました！検知時の写真を送信します。"
        }));
        // 画像ファイルを添付 (ファイル名: capture.jpg)
        formData.append('file', blob, 'capture.jpg');

        fetch(webhookUrl, {
          method: 'POST',
          body: formData
        })
        .then(() => updateStatus("🟢 Discordへ画像を送信しました！"))
        .catch(err => console.error("Discord画像送信エラー:", err));
      }, 'image/jpeg', 0.8);
    }
  </script>
</body>
</html>
