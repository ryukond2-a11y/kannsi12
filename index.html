<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易防犯カメラ</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    h2 { margin-top: 0; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    video, canvas { width: 100%; max-width: 480px; background: #000; border-radius: 6px; display: block; margin-bottom: 10px; }
    button, input { padding: 10px 15px; font-size: 14px; margin: 5px 2px; border: none; border-radius: 4px; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    input[type="text"] { background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px; }
    .status { font-weight: bold; color: #00ffcc; margin-bottom: 10px; padding: 10px; background: #222; border-radius: 4px; }
    .role-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #333; font-size: 12px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h2>📱 防犯カメラ（一方向配信）</h2>
  <div class="status" id="statusText">モードを選択してください</div>

  <!-- ルームID設定 -->
  <div class="card">
    <h3>🔑 接続設定</h3>
    <label>ルームID (同じ文字列を入力):</label><br>
    <input type="text" id="roomId" value="my-room-777" style="width: 80%; padding: 8px; margin-top: 5px;"><br><br>
    
    <button id="btnCamera" onclick="initCamera()">📷 1. 配信する（カメラ設置側）</button>
    <button id="btnMonitor" onclick="initMonitor()">📺 2. 見る（モニター閲覧側）</button>
  </div>

  <!-- 映像表示エリア -->
  <div class="card">
    <div id="roleBadge" class="role-badge">未接続</div>
    
    <!-- カメラ側用：自分のカメラ映像 -->
    <div id="cameraArea" style="display:none;">
      <p>📹 カメラのリアルタイム映像（送信中）:</p>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- モニター側用：相手から送られてくる映像 -->
    <div id="monitorArea" style="display:none;">
      <p>📺 カメラから受信中の映像:</p>
      <video id="remoteVideo" autoplay playsinline controls style="width:100%; min-height:240px; background:#222;"></video>
    </div>

    <canvas id="motionCanvas" style="display:none;"></canvas>
  </div>

  <!-- 動体検知 ＆ スマホ通知設定 -->
  <div class="card">
    <h3>🚨 動体検知 ＆ スマホ通知</h3>
    <label>Webhook URL (LINE Notify / Discord等):</label><br>
    <input type="text" id="webhookUrl" placeholder="https://..." style="width:90%;"><br><br>
    <label>感度閾値: <span id="threshVal">30</span></label><br>
    <input type="range" id="threshold" min="10" max="100" value="30" onchange="document.getElementById('threshVal').innerText=this.value">
  </div>

  <script>
    let localStream, pc, ws;
    let myRole = '';
    let roomId = '';
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    
    let motionInterval, prevFrame = null;
    let lastAlertTime = 0;

    const SIGNALING_SERVER = 'wss://kannsi-8g8j.onrender.com';

    // -------------------------------------------------------------
    // 1. 送信側（カメラ）の処理
    // -------------------------------------------------------------
    async function initCamera() {
      myRole = 'camera';
      disableButtons();
      document.getElementById('roleBadge').innerText = "モード: 📷 カメラ（送信側）";
      document.getElementById('cameraArea').style.display = 'block';

      try {
        // カメラとマイクのストリーム取得
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
          audio: true 
        });
        document.getElementById('localVideo').srcObject = localStream;
        
        startMotionDetection();
        connectWebSocket();
      } catch (err) {
        alert("カメラ/マイクの起動に失敗しました: " + err);
        updateStatus("エラー: カメラ起動失敗");
      }
    }

    // -------------------------------------------------------------
    // 2. 受信側（モニター）の処理
    // -------------------------------------------------------------
    function initMonitor() {
      myRole = 'monitor';
      disableButtons();
      document.getElementById('roleBadge').innerText = "モード: 📺 モニター（受信側）";
      document.getElementById('monitorArea').style.display = 'block';

      connectWebSocket();
    }

    // -------------------------------------------------------------
    // WebSocket ＆ WebRTC 接続管理
    // -------------------------------------------------------------
    function connectWebSocket() {
      roomId = document.getElementById('roomId').value.trim();
      if (!roomId) return alert("ルームIDを入力してください");

      updateStatus(`サーバー接続中... (ID: ${roomId})`);
      ws = new WebSocket(SIGNALING_SERVER);

      ws.onopen = () => {
        updateStatus("サーバー接続完了。待機中...");
        
        // モニター側から「映像を送ってください」と要求（Offer）を出す
        if (myRole === 'monitor') {
          startOfferLoop();
        }
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.roomId !== roomId || msg.sender === myRole) return;

        // モニターからの要求（Offer）を受け取ったら、カメラ側がAnswerを返す
        if (msg.sdp) {
          if (msg.sdp.type === 'offer' && myRole === 'camera') {
            await setupPeerConnection();
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            
            // 映像・音声をPeerConnectionに乗せる
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendSignal({ sdp: pc.localDescription });
            updateStatus("🟢 モニターへ映像を送信中！");
          } 
          else if (msg.sdp.type === 'answer' && myRole === 'monitor') {
            await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          }
        } else if (msg.candidate && pc) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch (e) {
            console.error("ICE追加エラー", e);
          }
        }
      };
    }

    async function setupPeerConnection() {
      if (pc) pc.close();
      pc = new RTCPeerConnection(config);

      pc.onicecandidate = (event) => {
        if (event.candidate) sendSignal({ candidate: event.candidate });
      };

      // モニター側が映像を受信したとき
      pc.ontrack = (event) => {
        if (myRole === 'monitor') {
          const remoteVideo = document.getElementById('remoteVideo');
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.play().catch(e => console.log("再生ブロック解除待ち", e));
          updateStatus("🟢 映像受信完了！リアルタイム監視中");
        }
      };
    }

    // モニター側：カメラが見つかるまで接続リクエストを定期送信
    let offerTimer = null;
    function startOfferLoop() {
      offerTimer = setInterval(async () => {
        if (pc && (pc.connectionState === 'connected' || pc.iceConnectionState === 'completed')) {
          clearInterval(offerTimer);
          return;
        }
        await setupPeerConnection();
        const offer = await pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
        await pc.setLocalDescription(offer);
        sendSignal({ sdp: pc.localDescription });
        updateStatus("カメラを探しています... (接続要求送信中)");
      }, 3000);
    }

    function sendSignal(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ ...data, roomId: roomId, sender: myRole }));
      }
    }

    function disableButtons() {
      document.getElementById('btnCamera').disabled = true;
      document.getElementById('btnMonitor').disabled = true;
    }

    function updateStatus(txt) {
      document.getElementById('statusText').innerText = txt;
    }

    // -------------------------------------------------------------
    // 動体検知 ＆ スマホ通知
    // -------------------------------------------------------------
    function startMotionDetection() {
      const video = document.getElementById('localVideo');
      const canvas = document.getElementById('motionCanvas');
      const ctx = canvas.getContext('2d');

      motionInterval = setInterval(() => {
        if (!video.videoWidth) return;

        canvas.width = 160;
        canvas.height = 120;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

        if (prevFrame) {
          let diffCount = 0;
          const threshold = parseInt(document.getElementById('threshold').value);

          for (let i = 0; i < currentFrame.data.length; i += 4) {
            const rDiff = Math.abs(currentFrame.data[i] - prevFrame.data[i]);
            const gDiff = Math.abs(currentFrame.data[i+1] - prevFrame.data[i+1]);
            const bDiff = Math.abs(currentFrame.data[i+2] - prevFrame.data[i+2]);

            if (rDiff + gDiff + bDiff > 100) diffCount++;
          }

          if (diffCount > (canvas.width * canvas.height) * (threshold / 1000)) {
            triggerAlert();
          }
        }
        prevFrame = currentFrame;
      }, 500);
    }

    function triggerAlert() {
      const now = Date.now();
      if (now - lastAlertTime < 30000) return;
      lastAlertTime = now;

      updateStatus("🚨 動体検知！スマホへ通知を送信中...");

      const webhookUrl = document.getElementById('webhookUrl').value;
      if (webhookUrl) {
        fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: "🚨 【防犯カメラ】動体を検知しました！" })
        }).catch(err => console.error("通知エラー:", err));
      }
    }
  </script>
</body>
</html>
